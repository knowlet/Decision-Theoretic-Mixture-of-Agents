name: OpenJev versus decision-theoretic controls
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/openjev-benchmark.yml', 'openjev_benchmark.py', 'openjev_sharded.py', 'openjev_protocol.json', 'analyze_openjev.py', 'test_openjev_benchmark.py', 'requirements-openjev.txt']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: openjev-benchmark-sharded-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stop_obsolete_native_attempt:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Stop only the known superseded native-CPU pilot, preserving its logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run=35309088991
          sha=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .head_sha)
          status=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .status)
          test "$sha" = '45f361937e92eab64fa42e2baf7390600ef391a4'
          if test "$status" != completed; then gh api --method POST "repos/$GH_REPO/actions/runs/$run/cancel"; fi
  inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: qwen35-4b, shard: 0}
          - {model: qwen35-4b, shard: 1}
          - {model: qwen35-4b, shard: 2}
          - {model: qwen35-4b, shard: 3}
          - {model: qwen35-4b, shard: 4}
          - {model: qwen35-4b, shard: 5}
          - {model: qwen35-4b, shard: 6}
          - {model: qwen35-4b, shard: 7}
          - {model: qwen35-4b, shard: 8}
          - {model: qwen35-4b, shard: 9}
          - {model: qwen35-4b, shard: 10}
          - {model: qwen35-4b, shard: 11}
          - {model: qwen35-0.8b, shard: 0}
          - {model: qwen35-0.8b, shard: 1}
          - {model: qwen35-0.8b, shard: 2}
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      PYTHONPATH: vendor/openjev/src
      RESEARCH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install frozen CPU runtime and original OpenJev readout
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-openjev.txt
          mkdir -p vendor/openjev verification
          curl --fail --location --retry 3 'https://codeload.github.com/TheoLeeCJ/openjev/tar.gz/b4782a6c953f05c6255706d7a219f4e032af5b58' | tar -xz -C vendor/openjev --strip-components=1
          python -m pip freeze > verification/environment.txt
          lscpu > verification/cpu.txt
      - name: Upstream scorer tests and our boundary tests
        run: |
          python -m pytest -q vendor/openjev/tests --junitxml=verification/upstream-tests.xml 2>&1 | tee verification/upstream-tests.log
          python -m pytest -q test_openjev_benchmark.py --junitxml=verification/benchmark-tests.xml 2>&1 | tee verification/benchmark-tests.log
      - name: Actual pinned model inference on assigned paired cases and probes
        run: python openjev_sharded.py shard --model '${{ matrix.model }}' --index '${{ matrix.shard }}' --download --out results/shard 2>&1 | tee verification/inference.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openjev-shard-${{ matrix.model }}-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            results/shard/
            verification/
          retention-days: 90
  analyze:
    needs: inference
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      RESEARCH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: openjev-shard-*-${{ github.run_id }}
          path: incoming
      - name: Install analysis environment
        run: |
          python -m pip install -r requirements-transfer.txt
          mkdir -p inputs verification
          python -m pip freeze > verification/environment.txt
      - name: Merge all shards and fit the same global development calibrators
        run: |
          for model in qwen35-4b qwen35-0.8b; do
            python openjev_sharded.py finalize --model "$model" --download --out "inputs/$model"
          done
      - name: All regression tests and two full ProEval reproductions
        run: |
          python -m pytest -q --junitxml=verification/transfer-tests.xml 2>&1 | tee verification/all-tests.log
          python transfer_study.py --download --out results/transfer
          python audit_transfer.py --out results/transfer
          python transfer_study.py --out results/transfer-repeat
          python audit_transfer.py --out results/transfer-repeat
          python ci_transfer.py
      - name: Paired analysis and independent evidence checks
        run: |
          python analyze_openjev.py --inputs inputs --out results/openjev 2>&1 | tee verification/headtohead.log
          python - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          paths=list(pathlib.Path('incoming').rglob('*tests.xml'))
          # Two pytest XML suites per inference shard: twelve 4B plus three 0.8B.
          assert len(paths)==30
          for p in paths:
              cases=list(ET.parse(p).getroot().iter('testcase'))
              assert cases and not any(c.find(k) is not None for c in cases for k in ('failure','error','skipped')),str(p)
          PY
      - name: Archive executed source and evidence without weights or raw prompts
        run: |
          git archive --format=tar.gz --output=verification/source.tar.gz HEAD
          python - <<'PY'
          import hashlib,pathlib,zipfile,shutil
          dist=pathlib.Path('dist-openjev');dist.mkdir(exist_ok=True)
          with zipfile.ZipFile(dist/'evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in ('results','inputs','verification','incoming'):
                  for p in sorted(pathlib.Path(folder).rglob('*')):
                      if p.is_file():z.write(p,str(p))
          for name in ('summary.csv','comparisons.csv','calibration.csv','robustness.csv','verification.json'):
              shutil.copy('results/openjev/'+name,dist/name)
          (dist/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(dist.iterdir()) if p.is_file()))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openjev-comparison-${{ github.run_id }}
          path: |
            dist-openjev/
            verification/
          retention-days: 90
  paper:
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      SOURCE_RUN: ${{ github.run_id }}
      SOURCE_COMMIT: ${{ github.sha }}
      REPORTING_COMMIT: ${{ github.sha }}
      REPORTING_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Require successful exact-source inference before any report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_COMMIT"
          # This job lives inside the run that produced the artifact, so the parent run
          # cannot report success while the job is still executing. Gate on the analyze
          # job that produced the comparison artifact instead.
          analyze=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "analyze")][0].conclusion')
          test "$analyze" = success
          gh run download "$SOURCE_RUN" --name "openjev-comparison-$SOURCE_RUN" --dir downloaded
          (cd downloaded/dist-openjev && sha256sum -c SHA256SUMS)
      - name: Restore executed source and add only separately tracked reporting files
        run: |
          python - <<'PY'
          import os,pathlib,shutil,zipfile
          out=pathlib.Path('experiment');out.mkdir()
          with zipfile.ZipFile('downloaded/dist-openjev/evidence.zip') as z:
              for name in z.namelist():
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(out)
          import tarfile
          with tarfile.open(out/'verification/source.tar.gz') as archive:
              archive.extractall(out,filter='data')
          import json
          v=json.loads((out/'results/openjev/verification.json').read_text())
          assert v['all_gates_passed'] and v['n_datasets']==len(v['datasets'])==6 and v['n_test']==192
          for name in ('report_openjev.py','build_openjev_pdf.sh','openjev_chapter.en.md','openjev_chapter.zh-TW.md'):
              shutil.copy(name,out/name)
          p=out/'openjev_chapter.zh-TW.md'
          p.write_text(p.read_text().replace('当前','當前').replace('预訓練','預訓練').replace('反转','反轉').replace('跑过','跑過'))
          PY
          python -m pip install -r experiment/requirements-transfer.txt
      - name: Independently recompute paired tables from archived inference records
        working-directory: experiment
        run: |
          python analyze_openjev.py --inputs inputs --out results/openjev-rechecked
          python - <<'PY'
          import os,json,pathlib,pandas as pd
          for name in ('summary.csv','comparisons.csv','calibration.csv','robustness.csv','by_dataset.csv','paired_cases.csv','selector_cost_sensitivity.csv'):
              pd.testing.assert_frame_equal(pd.read_csv('results/openjev/'+name),pd.read_csv('results/openjev-rechecked/'+name),check_dtype=False,rtol=1e-10,atol=1e-12)
          p=pathlib.Path('results/openjev-rechecked/verification.json');v=json.loads(p.read_text());v['operation']='analysis-only regeneration, not fresh inference';v['source_experiment_commit']=os.environ['SOURCE_COMMIT'];p.write_text(json.dumps(v,indent=2)+'\n')
          PY
      - name: Install complete manuscript toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc lmodern texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended fonts-noto-cjk fonts-liberation fonts-dejavu-core
      - name: Build complete English and Traditional Chinese manuscripts
        working-directory: experiment
        run: bash build_openjev_pdf.sh
      - name: Package experiment provenance and reporting provenance separately
        run: |
          python - <<'PY'
          import pathlib,zipfile,shutil,hashlib,json,os
          d=pathlib.Path('experiment/dist-paper')
          v=json.loads((d/'verification.json').read_text());assert v['experiment_commit']==os.environ['SOURCE_COMMIT'] and v['reporting_commit']==os.environ['GITHUB_SHA']
          with zipfile.ZipFile(d/'reproducibility.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write('downloaded/dist-openjev/evidence.zip','experiment-evidence.zip')
              for p in pathlib.Path('experiment/verification').glob('openjev-latex-*.log'):z.write(p,'rendering/'+p.name)
              for p in d.iterdir():
                  if p.is_file() and p.suffix in ('.pdf','.md','.json','.csv','.tex'):z.write(p,p.name)
          for pattern in ('*.aux','*.log','*.out'):
              for p in d.glob(pattern):p.unlink()
          (d/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(d.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openjev-paper-${{ github.run_id }}
          path: |
            experiment/dist-paper/
            experiment/verification/
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: paper
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: openjev-paper-${{ github.run_id }}
          path: evidence
      - name: Publish a new version only after all evidence checks
        working-directory: evidence/dist-paper
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c SHA256SUMS
          python - <<'PY'
          import json,os
          v=json.load(open('verification.json'))
          e=v['experiment_evidence']
          assert e['all_gates_passed'] and e['n_datasets']==6 and e['n_test']==192 and e['n_development']==96
          assert all(m['new_llm_api_calls']==m['jev_proprietary_calls']==m['cera_training_steps']==m['worker_generation_calls']==0 for m in e['model_runs'])
          assert e['total_local_selector_forwards']==sum(m['new_primary_local_forwards']+m['new_robustness_local_forwards']+m['warmup_forwards'] for m in e['model_runs'])
          assert v['experiment_commit']==os.environ['SOURCE_COMMIT']
          assert v['reporting_commit']==os.environ['GITHUB_SHA']
          assert all(s['failures']==s['skipped']==0 for s in v['test_suites'])
          PY
          if gh release view v1.5.0 >/dev/null 2>&1; then
            echo 'Version exists; its artifacts and tag were not overwritten.'
          else
            gh release create v1.5.0 --target "$GITHUB_SHA" --title 'v1.5.0 — six-task replay and widened OpenJev head-to-head' --notes 'Adds gqa and jigsaw to the pinned ProEval replay, doubling the primary task pool to six binary datasets and widening the executed OpenJev selector pilot from 128 to 192 held-out groups with 96 development cases. The four earlier datasets keep their published split and selection salts, so every previously scored case is still selected. One added task is deferral-dominated under the declared loss and is reported as such rather than excluded. Includes full bilingual manuscripts, paired bootstrap intervals, order probes and a fail-closed evidence bundle. Local OpenJev inference only: no proprietary Jev, no CERA training, no live worker generation. Public technical report, not peer review.' ./*
          fi
