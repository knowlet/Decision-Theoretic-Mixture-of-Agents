name: OpenJev versus decision-theoretic controls
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/openjev-benchmark.yml', 'openjev_benchmark.py', 'openjev_protocol.json', 'analyze_openjev.py', 'test_openjev_benchmark.py', 'requirements-openjev.txt']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: openjev-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        model: [qwen35-4b, qwen35-0.8b]
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      PYTHONPATH: vendor/openjev/src
      RESEARCH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install frozen CPU runtime and original OpenJev readout
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-openjev.txt
          mkdir -p vendor/openjev verification
          curl --fail --location --retry 3 'https://codeload.github.com/TheoLeeCJ/openjev/tar.gz/b4782a6c953f05c6255706d7a219f4e032af5b58' | tar -xz -C vendor/openjev --strip-components=1
          python -m pip freeze > verification/environment.txt
          lscpu > verification/cpu.txt
      - name: Original upstream scorer tests and our boundary tests
        run: |
          python -m pytest -q vendor/openjev/tests --junitxml=verification/upstream-tests.xml 2>&1 | tee verification/upstream-tests.log
          python -m pytest -q test_openjev_benchmark.py --junitxml=verification/benchmark-tests.xml 2>&1 | tee verification/benchmark-tests.log
      - name: Actual pinned model inference on paired cases and robustness probes
        run: python openjev_benchmark.py --model '${{ matrix.model }}' --download --out 'results/${{ matrix.model }}' 2>&1 | tee verification/inference.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openjev-${{ matrix.model }}-${{ github.run_id }}
          path: |
            results/${{ matrix.model }}/
            verification/
          retention-days: 90
  analyze:
    needs: inference
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      RESEARCH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: openjev-*-${{ github.run_id }}
          path: incoming
      - name: Install analysis environment and collect exact model ledgers
        run: |
          python -m pip install -r requirements-transfer.txt
          mkdir -p inputs verification
          for model in qwen35-4b qwen35-0.8b; do
            cp -r "incoming/openjev-$model-${{ github.run_id }}/results/$model" "inputs/$model"
          done
          python -m pip freeze > verification/environment.txt
      - name: All regression tests and two full ProEval refresh reproductions
        run: |
          python -m pytest -q --junitxml=verification/transfer-tests.xml 2>&1 | tee verification/all-tests.log
          python transfer_study.py --download --out results/transfer
          python audit_transfer.py --out results/transfer
          python transfer_study.py --out results/transfer-repeat
          python audit_transfer.py --out results/transfer-repeat
          python ci_transfer.py
      - name: Paired analysis and independent evidence checks
        run: |
          python analyze_openjev.py --inputs inputs --out results/openjev 2>&1 | tee verification/headtohead.log
          python - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          for p in pathlib.Path('incoming').rglob('*tests.xml'):
              cases=list(ET.parse(p).getroot().iter('testcase'))
              assert cases and not any(c.find(k) is not None for c in cases for k in ('failure','error','skipped')),str(p)
          PY
      - name: Archive executed source and evidence without weights or raw prompts
        run: |
          git archive --format=tar.gz --output=verification/source.tar.gz HEAD
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('.');dist=root/'dist-openjev';dist.mkdir(exist_ok=True)
          with zipfile.ZipFile(dist/'evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in ('results','inputs','verification','incoming'):
                  for p in sorted(pathlib.Path(folder).rglob('*')):
                      if p.is_file():z.write(p,str(p))
          import shutil
          for name in ('summary.csv','comparisons.csv','calibration.csv','robustness.csv','verification.json'):
              shutil.copy('results/openjev/'+name,dist/name)
          (dist/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(dist.iterdir()) if p.is_file()))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openjev-comparison-${{ github.run_id }}
          path: |
            dist-openjev/
            verification/
          retention-days: 90
