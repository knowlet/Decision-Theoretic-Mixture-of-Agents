name: Inspect external trace schema
on:
  push:
    paths: ['.github/workflows/external-schema.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Download hash-pinned historical traces and inspect schema only
        shell: bash
        run: |
          mkdir -p inspection
          python - <<'PY'
          import hashlib, importlib, json, pathlib, pickle, urllib.request
          url='https://huggingface.co/datasets/withmartian/routerbench/resolve/784021482c3f320c6619ed4b3bb3b41a21424fcb/routerbench_0shot.pkl?download=true'
          path=pathlib.Path('inspection/routerbench_0shot.pkl')
          urllib.request.urlretrieve(url,path)
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          assert digest=='ba4f77f19517610a707c374e99322d7750c30fc4ae7ff5527888595a1e65d36d', digest
          allowed={('numpy','dtype'),('numpy','ndarray'),('pandas.core.internals.managers','BlockManager'),('pandas.core.frame','DataFrame'),('pandas._libs.internals','_unpickle_block'),('pandas.core.indexes.base','_new_Index'),('pandas.core.indexes.base','Index'),('pandas.core.indexes.range','RangeIndex'),('numpy.core.numeric','_frombuffer'),('numpy.core.multiarray','_reconstruct'),('builtins','slice')}
          class Restricted(pickle.Unpickler):
              def find_class(self,module,name):
                  if (module,name) not in allowed:
                      raise pickle.UnpicklingError(f'disallowed global: {module}.{name}')
                  return getattr(importlib.import_module(module),name)
          with path.open('rb') as f: df=Restricted(f).load()
          print('shape',df.shape)
          print('columns',df.columns.tolist())
          report={'sha256':digest,'shape':list(df.shape),'columns':df.columns.tolist(),'dtypes':{str(k):str(v) for k,v in df.dtypes.items()}}
          for c in ('eval_name','dataset','task','sample_id'):
              if c in df:
                  report[c]={'examples':[str(x)[:100] for x in df[c].head(8)],'nunique':int(df[c].nunique())}
                  if c!='sample_id': report[c]['counts']=df[c].value_counts().to_dict()
          # Only inspect input/output formatting, never report aggregate quality.
          report['format_examples']={str(c):str(df.iloc[0][c])[:1200] for c in df.columns if any(s in str(c).lower() for s in ('prompt','input','response','output','answer'))}
          pathlib.Path('inspection/schema.json').write_text(json.dumps(report,indent=2,default=str))
          print(json.dumps(report,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-trace-schema
          path: inspection/
          retention-days: 7
