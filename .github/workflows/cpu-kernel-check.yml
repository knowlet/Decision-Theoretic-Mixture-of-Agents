name: CPU numerical kernel check
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/cpu-kernel-check.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install same pinned CPU implementation
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-openjev.txt
          mkdir -p vendor/openjev kernel
          curl --fail --location --retry 3 'https://codeload.github.com/TheoLeeCJ/openjev/tar.gz/b4782a6c953f05c6255706d7a219f4e032af5b58' | tar -xz -C vendor/openjev --strip-components=1
          lscpu > kernel/cpu.txt
      - name: Compare complete readout on owned non-benchmark prompts
        env:
          PYTHONPATH: vendor/openjev/src
        run: |
          python - <<'PY'
          import json,pathlib,time,torch
          from openjev_phase1.direct import score
          from openjev_benchmark import cpu_model
          model,tokenizer,metadata=cpu_model('qwen35-4b')
          rows=[{'id':'kernel-short','state':'The user asks to reset a forgotten password.','question':'Which team should own this case?','options':[{'id':'access','description':'Account access'},{'id':'billing','description':'Billing'}]}, {'id':'kernel-long','state':'The user asks to reset a forgotten password. '+'The case contains no refund request. '*60,'question':'Which team should own this case?','options':[{'id':'access','description':'Account access'},{'id':'billing','description':'Billing'}]}]
          original=score(model,tokenizer,rows[0],metadata)
          import torch.nn.functional as F
          old_linear=torch.nn.Linear.forward;old_conv=torch.nn.Conv1d.forward
          def cpu_linear(self,x):
              if x.device.type=='cpu' and x.dtype==torch.bfloat16:
                  return F.linear(x.float(),self.weight.float(),None if self.bias is None else self.bias.float()).to(x.dtype)
              return old_linear(self,x)
          def cpu_conv(self,x):
              if x.device.type=='cpu' and x.dtype==torch.bfloat16:
                  return self._conv_forward(x.float(),self.weight.float(),None if self.bias is None else self.bias.float()).to(x.dtype)
              return old_conv(self,x)
          torch.nn.Linear.forward=cpu_linear;torch.nn.Conv1d.forward=cpu_conv
          faster=[score(model,tokenizer,row,metadata) for row in rows]
          maximum=max(abs(a-b) for a,b in zip(original['probabilities'],faster[0]['probabilities']))
          obj={'original':original,'fp32_accumulation':faster,'probability_max_difference':maximum,'precision':'BF16 stored weights and layer outputs; CPU Linear/Conv FP32 accumulation; no quantization or parameter updates','scope':'Owned compatibility probes only, not benchmark quality'}
          pathlib.Path('kernel/results.json').write_text(json.dumps(obj,indent=2));print(json.dumps(obj,indent=2))
          assert maximum<1e-4
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cpu-kernel-${{ github.run_id }}
          path: kernel/
          retention-days: 14
