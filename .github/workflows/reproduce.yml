name: Reproduce and publish technical report
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned research dependencies
        run: |
          python -m pip install -r requirements.txt
          mkdir -p verification
          python -m pip freeze > verification/environment.txt
      - name: Execute tests and all experiments twice
        run: bash verify.sh
      - name: Install document toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc lmodern texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended fonts-noto-cjk fonts-liberation fonts-dejavu-core
          { pandoc --version; xelatex --version; } > verification/document-toolchain.txt
      - name: Build revised Chinese and English manuscripts
        run: bash build_pdf.sh
      - name: Package research artifacts
        env:
          RESEARCH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: research-verification-${{ github.run_id }}
          path: |
            dist/
            verification/
            results/
            latex_build*.log
          retention-days: 90
      - name: Publish versioned, non-peer-reviewed technical report
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo 'Version v1.1.0 already exists; its assets were not changed.'
          else
            gh release create v1.1.0 --target "$(git rev-parse HEAD)" --title 'v1.1.0 — audited synthetic decision study' --notes-file RELEASE_NOTES.md dist/*
          fi
