name: Reproduce and publish technical report
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize audited source bundle when present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f .source-bundle.json; then
            python - <<'PY'
          import base64, hashlib, io, json, pathlib, subprocess, tarfile
          spec = json.loads(pathlib.Path('.source-bundle.json').read_text())
          parts = []
          for sha in spec['blob_shas']:
              response = subprocess.check_output(['gh','api',f"repos/{spec['repository']}/git/blobs/{sha}"])
              parts.append(base64.b64decode(json.loads(response)['content']))
          data = b''.join(parts)
          assert hashlib.sha256(data).hexdigest() == spec['sha256'], 'Source bundle integrity failure'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              for item in archive.getmembers():
                  p = pathlib.PurePosixPath(item.name)
                  assert not p.is_absolute() and '..' not in p.parts and p.parts[0] != '.git'
                  assert item.isfile() or item.isdir(), 'Links and special files are not allowed'
              archive.extractall('.', filter='data')
          pathlib.Path('.source-bundle.json').unlink()
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --all
            git commit -m 'Materialize audited source, manuscript and verification scripts'
            git push origin HEAD:develop
          fi
      - name: Detect source
        id: source
        run: |
          if test -f study.py; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.source.outputs.ready == 'true'
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned research dependencies
        if: steps.source.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt
      - name: Execute tests and all experiments twice
        if: steps.source.outputs.ready == 'true'
        run: bash verify.sh
      - name: Install document toolchain
        if: steps.source.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-noto-cjk fonts-liberation fonts-dejavu-core
      - name: Build revised Chinese and English manuscripts
        if: steps.source.outputs.ready == 'true'
        run: bash build_pdf.sh
      - name: Package research artifacts
        if: steps.source.outputs.ready == 'true'
        env:
          RESEARCH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python package_release.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.source.outputs.ready == 'true'
        with:
          name: research-verification-${{ github.run_id }}
          path: |
            dist/
            verification/
            results/
            latex_build*.log
          retention-days: 90
      - name: Publish versioned, non-peer-reviewed technical report
        if: steps.source.outputs.ready == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo 'Version v1.1.0 already exists; immutable release was not changed.'
          else
            gh release create v1.1.0 --target "$(git rev-parse HEAD)" --title 'v1.1.0 — audited synthetic decision study' --notes-file RELEASE_NOTES.md dist/*
          fi
