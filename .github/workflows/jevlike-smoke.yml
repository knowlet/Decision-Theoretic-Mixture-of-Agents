name: Three Jev-like checkpoints CPU smoke
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/jevlike-smoke.yml','jevbench/adapters.py','requirements-jevlike.txt']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        model: [nanojev, decider, system_one]
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Install pinned CPU environment and inspected source
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-jevlike.txt
          mkdir -p vendor/nanojev smoke
          curl --fail --location --retry 3 'https://codeload.github.com/TianyuCodings/NanoJev/tar.gz/71a513bb0163b5634467842b523ee0c0ed6fb1c7' | tar -xz -C vendor/nanojev --strip-components=1
          python -m pip freeze > smoke/environment.txt
          lscpu > smoke/cpu.txt
      - name: New model forwards on owned English and Chinese cases
        env: {MODEL: '${{ matrix.model }}'}
        run: |
          python - <<'PY'
          import json,os,pathlib
          from jevbench.adapters import Adapter
          adapter=Adapter(os.environ['MODEL'])
          rows=[{'id':'owned-en','state':'A passenger bought a ticket but cannot log into the website. No payment dispute is mentioned.','question':'Which support team should handle this request?','options':[{'id':'access','text':'Account access'},{'id':'billing','text':'Billing disputes'}]}, {'id':'owned-zh','state':'小明身上穿著一件藍色外套。','question':'「小明有穿衣服」是否可由上文推出？','options':[{'id':'yes','text':'可以推出'},{'id':'no','text':'不能推出'}]}]
          scores=[adapter.score(r) for r in rows]
          for s in scores:assert len(s['probabilities'])==2 and abs(sum(s['probabilities'])-1)<1e-6
          pathlib.Path('smoke/results.json').write_text(json.dumps({'metadata':adapter.meta,'scores':scores,'scope':'Owned compatibility probes, NOT dataset benchmark results'},indent=2))
          print(json.dumps({'model':os.environ['MODEL'],'scores':scores},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jevlike-smoke-${{ matrix.model }}-${{ github.run_id }}
          path: smoke/
          retention-days: 14
