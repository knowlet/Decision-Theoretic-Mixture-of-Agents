name: Answer-aware optimizer validation
on:
  push:
    branches: ['optimize/answer-aware-router', develop]
    paths: ['.github/workflows/optimizer.yml', 'optimizer*.py', 'optimizer_protocol.json', 'adaptive_router.py', 'test_adaptive_router.py', 'transfer_study.py', 'transfer_protocol.json', 'requirements-transfer.txt']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: answer-aware-optimizer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      RESEARCH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - name: Install existing pinned numerical dependencies
        run: |
          python -m pip install -r requirements-transfer.txt
          mkdir -p verification
          python -m pip freeze > verification/environment.txt
          lscpu > verification/cpu.txt
      - name: All regressions, independent reference and deployment contract tests
        run: python -m pytest -q test_*.py --junitxml=verification/optimizer-tests.xml 2>&1 | tee verification/tests.log
      - name: First complete six-task three-split evaluation
        run: |
          python optimizer_study.py --download --out results/optimizer 2>&1 | tee verification/first.log
          python optimizer_diagnostics.py --out results/optimizer
      - name: Separate process including refitting and all parameter choices
        run: |
          python optimizer_study.py --out results/optimizer-repeat 2>&1 | tee verification/second.log
          python optimizer_diagnostics.py --out results/optimizer-repeat
      - name: Recompute losses, gate decisions, state equivalence and output identity
        run: python optimizer_ci.py 2>&1 | tee verification/gates.log
      - name: Build result-derived reports and archive exact source
        run: |
          python optimizer_report.py
          git archive --format=tar.gz --output=dist-optimizer/source.tar.gz HEAD
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          d=pathlib.Path('dist-optimizer')
          v=json.load(open(d/'verification.json'))
          assert v['all_gates_passed'] and v['failures']==v['skipped']==0
          with zipfile.ZipFile(d/'optimizer-evidence.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.write(d/'source.tar.gz','source.tar.gz')
              for folder in ('results/optimizer','results/optimizer-repeat','verification'):
                  for p in sorted(pathlib.Path(folder).rglob('*')):
                      if p.is_file():z.write(p,str(p))
              for p in sorted(d.iterdir()):
                  if p.suffix in ('.md','.csv','.json'):z.write(p,p.name)
          (d/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(d.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: answer-aware-optimizer-${{ github.run_id }}
          path: |
            dist-optimizer/
            verification/
          if-no-files-found: error
          retention-days: 90
