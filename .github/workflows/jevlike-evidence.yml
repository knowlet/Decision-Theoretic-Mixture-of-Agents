name: Jev-like evidence verification

# The native benchmark workflow only builds the fixture and runs inference. This workflow closes
# the gap the review found: it runs the whole test suite in CI, re-downloads the pinned pilot
# artifacts, re-derives the native numbers with the independent reader, re-runs the analysis and the
# three diagnostics that were added after the pilot, and fails if the two readers disagree.
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/jevlike-evidence.yml'
      - 'jevbench/**'
      - 'jevbench_*.py'
      - 'verify_jevbench.py'
      - 'test_jevbench*.py'
      - 'test_verify_jevbench.py'
      - 'requirements-jevlike.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: jevlike-evidence-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_RUN: '35364030597'
  SOURCE_COMMIT: 'f1cb66b6374167cfddef8eefec4cc537523cb445'
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
      RESEARCH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-transfer.txt
      - name: Install the pinned analysis environment without any model runtime
        run: |
          python -m pip install -r requirements-transfer.txt
          mkdir -p verification
          python -m pip freeze > verification/environment.txt
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("torch") is None, "model runtime present in an analysis-only job"
          print("no torch, as intended")
          PY
      - name: The whole suite, including the readers and diagnostics, in CI
        run: python -m pytest -q --junitxml=verification/all-tests.xml 2>&1 | tee verification/all-tests.log
      - name: Re-download the pinned pilot artifacts and their separate gold
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .head_sha)" = "$SOURCE_COMMIT"
          test "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .conclusion)" = success
          mkdir -p incoming evaluation fixture
          gh run download "$SOURCE_RUN" --dir downloaded
          test -f downloaded/jev16-inputs-$SOURCE_RUN/requests.jsonl
          test -f downloaded/jev16-evaluation-$SOURCE_RUN/gold.jsonl
          cp downloaded/jev16-inputs-$SOURCE_RUN/requests.jsonl fixture/
          cp downloaded/jev16-inputs-$SOURCE_RUN/manifest.json fixture/
          cp downloaded/jev16-evaluation-$SOURCE_RUN/gold.jsonl evaluation/
          cp downloaded/jev16-evaluation-$SOURCE_RUN/manifest.json evaluation/
          mv downloaded/jev16-shard-* incoming/
          ls incoming | wc -l
      - name: Independent reader and the analysis, then the three diagnostics
        run: |
          python verify_jevbench.py --incoming incoming --fixture fixture --evaluation evaluation --out results/jev16-independent 2>&1 | tee verification/independent.log
          python -m jevbench.analyze --incoming incoming --fixture fixture --evaluation evaluation --out results/jev16 2>&1 | tee verification/analysis.log
          python jevbench_fitgap.py --incoming incoming --fixture fixture --evaluation evaluation --out results/jev16-fitgap 2>&1 | tee verification/fitgap.log
          python jevbench_learning_curve.py --incoming incoming --fixture fixture --evaluation evaluation --out results/jev16-learning-curve 2>&1 | tee verification/learning-curve.log
          python jevbench_competence.py --incoming incoming --fixture fixture --evaluation evaluation --out results/jev16-competence 2>&1 | tee verification/competence.log
      - name: Fail unless the two readers agree and the analysis gates hold
        run: |
          python - <<'PY'
          import json, pathlib
          import pandas as pd
          independent = json.loads(pathlib.Path('results/jev16-independent/independent_native.json').read_text())
          assert not independent['problems'], independent['problems']
          assert independent['shards'] == 12, independent['shards']
          assert independent['primary_records'] == 960 and independent['probe_records'] == 72, independent
          published = pd.read_csv('results/jev16/native_summary.csv')
          mine = pd.DataFrame(independent['summary'])
          # the analysis publishes one row per model and dataset; the reader also reports an
          # ALL row per model, which has nothing to compare against.
          mine = mine[mine.dataset.isin(published.dataset.unique())]
          frame = published.merge(mine, on=['model', 'dataset'], suffixes=('_analysis', '_independent'))
          assert len(frame) == len(published) == len(mine), (len(frame), len(published), len(mine))
          for column in ('accuracy', 'wilson_low', 'wilson_high', 'p50_ms', 'p95_ms'):
              delta = (frame[column + '_analysis'] - frame[column + '_independent']).abs().max()
              assert delta < 1e-6, (column, delta)
          verification = json.loads(pathlib.Path('results/jev16/verification.json').read_text())
          assert verification['all_gates_passed']
          assert (verification['primary_forwards'], verification['probe_forwards'],
                  verification['warmup_forwards'], verification['total_forwards']) == (960, 72, 36, 1068)
          print('independent reader and analysis agree on', len(frame), 'model/dataset cells')
          PY
      - name: Record the headline numbers in the job summary
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          summary = pathlib.Path('results/jev16/native_summary.csv')
          rows = pathlib.Path('results/jev16-competence/competence_metrics.csv')
          for path in (summary, rows):
              if path.exists():
                  print('### ' + path.name)
                  print('```')
                  print(path.read_text())
                  print('```')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jevlike-evidence-${{ github.run_id }}
          path: |
            results/
            verification/
          retention-days: 90
          if-no-files-found: error
