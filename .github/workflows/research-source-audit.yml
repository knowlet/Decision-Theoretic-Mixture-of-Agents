name: Research source audit
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/research-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Retrieve immutable dataset revision and report schema, not results
        run: |
          mkdir -p source-audit/data source-audit/literature
          python - <<'PY'
          import csv,hashlib,io,json,pathlib,urllib.request,concurrent.futures,subprocess
          root=pathlib.Path('source-audit')
          rev='9d37b037d1d91f4b78a7ddd74a43a8aecb344c66'
          names=('gsm8k','svamp','mmlu','strategyqa','dices')
          def fetch_dataset(name):
              url=f'https://raw.githubusercontent.com/google-deepmind/proeval/{rev}/data/{name}_predictions.csv'
              with urllib.request.urlopen(url,timeout=180) as response: data=response.read()
              path=root/'data'/f'{name}_predictions.csv';path.write_bytes(data)
              csv.field_size_limit(100_000_000)
              reader=csv.DictReader(io.StringIO(data.decode('utf-8-sig')))
              rows=list(reader)
              cols=reader.fieldnames
              assert len(rows)>100 and 'ground_truth' in cols
              report={'dataset':name,'url':url,'revision':rev,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'rows':len(rows),'columns':cols,'examples':[{k:v for k,v in r.items() if k=='index' or k=='ground_truth' or k.startswith('prediction_')} for r in rows[:3]]}
              print(json.dumps({k:v for k,v in report.items() if k not in ('columns','examples')}),flush=True)
              return report
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              reports=list(pool.map(fetch_dataset,names))
          (root/'datasets.json').write_text(json.dumps(reports,indent=2))
          targets={'cera.pdf':'https://arxiv.org/pdf/2609.18779v1','cera.html':'https://arxiv.org/html/2609.18779v1','jev.html':'https://typesafe.ai/blog/introducing-system-one-models-and-jev','jev-docs.txt':'https://docs.typesafe.ai/llms-full.txt','proeval-readme.md':f'https://raw.githubusercontent.com/google-deepmind/proeval/{rev}/data/README.md'}
          source_reports=[]
          for name,url in targets.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'DTMoA-Research/1.3 (primary-source audit)'})
                  with urllib.request.urlopen(req,timeout=90) as response:data=response.read()
                  (root/'literature'/name).write_bytes(data)
                  source_reports.append({'name':name,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'success':True})
              except Exception as exc:source_reports.append({'name':name,'url':url,'success':False,'error':str(exc)})
          (root/'literature.json').write_text(json.dumps(source_reports,indent=2))
          (root/'provenance.json').write_text(json.dumps({'tested_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'purpose':'Source availability/schema only, not an evaluation or performance result'},indent=2))
          subprocess.run(['git','archive','--format=tar','HEAD','-o',str(root/'source.tar')],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-source-audit-${{ github.run_id }}
          path: source-audit/
          if-no-files-found: error
          retention-days: 7
