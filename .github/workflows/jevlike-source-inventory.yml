name: Expanded fixture source inventory (offline)

on:
  pull_request:
    paths:
      - '.github/workflows/jevlike-source-inventory.yml'
      - 'jevbench/expanded_fixtures.py'
      - 'jevbench/expanded_registry.py'
      - 'jevbench/fixtures.py'
      - 'expanded_protocol.json'
      - 'test_jevbench_source_inventory.py'
      - 'requirements.txt'
      - 'requirements-transfer.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Install pinned fixture-test dependencies
        run: python -m pip install -r requirements-transfer.txt
      - name: Test synthetic local sources only
        run: python -m unittest -v test_jevbench_source_inventory.py
      - name: Compile changed Python files
        run: python -m compileall -q jevbench/expanded_fixtures.py test_jevbench_source_inventory.py
