name: External validity replay
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/external.yml', 'external*.py', 'test_external.py', 'external*.json', 'requirements-external.txt', 'build_external_paper.py', 'package_external.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: external-validity-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  external:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-external.txt
          mkdir -p verification
          python -m pip freeze > verification/external-environment.txt
      - name: Original and external unit tests
        run: python -m pytest -q test_study.py test_revision.py test_external.py --junitxml=verification/all-tests.xml 2>&1 | tee verification/external-tests.log
      - name: Real historical response replay
        run: python external_replay.py --download 2>&1 | tee verification/external-replay.log
      - name: Independent benchmark grading and frozen zero-to-five-shot shift
        run: |
          python external_audit.py 2>&1 | tee verification/external-audit.log
          python -c "import pandas as pd; pd.read_parquet('.cache/mmlu_test.parquet').to_json('.cache/mmlu_test.json',orient='records')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: external-validity-${{ github.run_id }}
          path: |
            results/external/
            verification/
          retention-days: 90
      - name: Temporary pinned inputs for cross-runtime verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: external-audit-inputs-${{ github.run_id }}
          path: |
            .cache/mmlu_test.parquet
            .cache/mmlu_test.json
            .cache/routerbench_5shot.pkl
          include-hidden-files: true
          retention-days: 7
