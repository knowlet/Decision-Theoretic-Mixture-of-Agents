name: OpenJev source and CPU audit
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/openjev-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive inspected source and model metadata, not weights
        run: |
          mkdir -p audit
          git archive --format=tar.gz --output=audit/project.tar.gz HEAD
          curl --fail --location --retry 3 'https://codeload.github.com/TheoLeeCJ/openjev/tar.gz/b4782a6c953f05c6255706d7a219f4e032af5b58' -o audit/openjev.tar.gz
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request
          out=pathlib.Path('audit')
          models=('Qwen/Qwen3.5-4B','Qwen/Qwen3.5-0.8B','Qwen/Qwen2.5-0.5B-Instruct')
          for i,m in enumerate(models):
              with urllib.request.urlopen('https://huggingface.co/api/models/'+m,timeout=90) as r:obj=json.load(r)
              (out/f'model-{i}.json').write_text(json.dumps(obj,indent=2))
          (out/'checksums.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir()},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openjev-source-${{ github.run_id }}
          path: audit/
          retention-days: 14
  cpu_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned CPU runtime and source without dependency substitution
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.17.0 accelerate==1.12.0 safetensors==0.8.0 huggingface-hub==1.31.0 tokenizers==0.23.2 numpy==2.2.6 sentencepiece==0.2.1 protobuf==7.36.1
          mkdir -p vendor/openjev smoke
          curl --fail --location --retry 3 'https://codeload.github.com/TheoLeeCJ/openjev/tar.gz/b4782a6c953f05c6255706d7a219f4e032af5b58' | tar -xz -C vendor/openjev --strip-components=1
          python -m pip freeze > smoke/environment.txt
      - name: Execute upstream direct scorer with explicit CPU-only loading adapter
        env:
          PYTHONPATH: vendor/openjev/src
        run: |
          python - <<'PY'
          import json,time,pathlib,platform,resource
          import torch,transformers
          from openjev_phase1.direct import score
          torch.set_num_threads(4)
          source='Qwen/Qwen3.5-4B';revision='851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a'
          start=time.perf_counter()
          config=transformers.AutoConfig.from_pretrained(source,revision=revision,trust_remote_code=False).get_text_config()
          tokenizer=transformers.AutoTokenizer.from_pretrained(source,revision=revision,trust_remote_code=False)
          model,loading=transformers.Qwen3_5ForCausalLM.from_pretrained(source,revision=revision,config=config,dtype=torch.bfloat16,device_map={'':'cpu'},low_cpu_mem_usage=True,trust_remote_code=False,output_loading_info=True)
          assert not any(loading.get(k) for k in ('missing_keys','mismatched_keys','error_msgs')),str(loading)
          model.eval();load_seconds=time.perf_counter()-start
          row={'id':'owned-smoke-only','state':'A support ticket says the customer cannot sign in after resetting the password. No payment issue is mentioned.','question':'Which team should own this ticket?','options':[{'id':'access','description':'Account access support'},{'id':'billing','description':'Billing support'}]}
          results=[score(model,tokenizer,row,{'source':source,'revision':revision,'device':'cpu','dtype':'bfloat16','cpu_loading_adapter':True},2048) for _ in range(2)]
          obj={'scope':'Runtime smoke only; not benchmark quality','load_seconds':load_seconds,'max_rss_kb':resource.getrusage(resource.RUSAGE_SELF).ru_maxrss,'torch':torch.__version__,'transformers':transformers.__version__,'platform':platform.platform(),'results':results}
          pathlib.Path('smoke/result.json').write_text(json.dumps(obj,indent=2));print(json.dumps(obj,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openjev-cpu-smoke-${{ github.run_id }}
          path: smoke/
          retention-days: 14
