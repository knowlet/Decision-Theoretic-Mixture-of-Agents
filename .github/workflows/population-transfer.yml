name: Population transfer and typed decisions
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/population-transfer.yml', 'transfer_*', 'test_transfer.py', 'audit_transfer.py', 'ci_transfer.py', 'decision_contract.py', 'requirements-transfer.txt', 'build_transfer*', 'package_transfer.py', 'LITERATURE_v1.3.md', 'V1.3_CHANGELOG.md']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: population-transfer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      RESEARCH_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - name: Install and record research environment
        run: |
          python -m pip install -r requirements-transfer.txt
          mkdir -p verification
          python -m pip freeze > verification/transfer-environment.txt
      - name: All regression, transfer and typed-contract tests
        run: python -m pytest -q --junitxml=verification/transfer-tests.xml 2>&1 | tee verification/transfer-tests.log
      - name: First full five-dataset replay and source-quality audit
        run: |
          python transfer_study.py --download --out results/transfer 2>&1 | tee verification/transfer-first.log
          python audit_transfer.py --out results/transfer
      - name: Second process including every fit and development selection
        run: |
          python transfer_study.py --out results/transfer-repeat 2>&1 | tee verification/transfer-second.log
          python audit_transfer.py --out results/transfer-repeat
      - name: Verify locked protocol, ledgers, paired cases and all outputs
        run: python ci_transfer.py 2>&1 | tee verification/transfer-gates.log
      - name: Install manuscript toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc lmodern texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended fonts-noto-cjk fonts-liberation fonts-dejavu-core
          { pandoc --version; xelatex --version; } > verification/transfer-document-toolchain.txt
      - name: Build both result-derived full manuscripts
        run: bash build_transfer_pdf.sh
      - name: Package exact source and derived results
        run: python package_transfer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: population-transfer-${{ github.run_id }}
          path: |
            dist-transfer/
            verification/
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: transfer
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: population-transfer-${{ github.run_id }}
          path: evidence
      - name: Verify evidence and publish previously unused version only
        working-directory: evidence/dist-transfer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c SHA256SUMS
          python - <<'PY'
          import json,os
          p=json.load(open('verification.json'))
          assert p['all_gates_passed'] and p['failures']==0 and p['skipped']==0
          assert p['tested_commit']==os.environ['GITHUB_SHA']
          assert p['source']['new_llm_api_calls']==p['source']['jev_calls']==p['source']['cera_agent_training_steps']==0
          PY
          # The transfer layer alone already has its versioned release. The combined
          # v1.5 report, which embeds this layer plus the widened OpenJev head-to-head,
          # is published by the OpenJev paper workflow so that one version number
          # corresponds to one evidence bundle. This job only attests the transfer run.
          if gh release view v1.3.0 >/dev/null 2>&1; then
            echo 'v1.3.0 already exists; existing source and assets are not overwritten.'
          else
            gh release create v1.3.0 --target "$GITHUB_SHA" --title 'v1.3.0 — population transfer, calibration and typed-decision audit' --notes 'Five pinned ProEval files; four primary binary tasks and a quarantined ordinal diagnostic. Two full replay processes and fail-closed ledgers. Includes full English and Traditional Chinese manuscripts. CERA-MoA and Jev are compared from primary sources, not reproduced. No new LLM/Jev inference or agent training. Public technical report, not peer review.' ./*
          fi
