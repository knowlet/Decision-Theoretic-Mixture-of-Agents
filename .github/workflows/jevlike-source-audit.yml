name: Jev-like model and dataset source audit
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/jevlike-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Resolve and retrieve source only, no model inference or weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit
          python - <<'PY'
          import concurrent.futures,hashlib,json,pathlib,subprocess,urllib.request,time
          root=pathlib.Path('audit');manifest={'github':{},'models':{},'datasets':{}}
          def get(url):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'DTMoA-source-audit/1.6'}),timeout=120) as r:return r.read()
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2**attempt)
          def save(path,data):
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
              return {'path':str(path.relative_to(root)),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          for repo in ('TianyuCodings/NanoJev','Mapika/decider','CLUEbenchmark/OCNLI','clinc/oos-eval'):
              info=json.loads(subprocess.check_output(['gh','api','repos/'+repo],text=True));branch=info['default_branch']
              ref=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/commits/'+branch],text=True));rev=ref['sha']
              entry=save(root/'repos'/(repo.replace('/','__')+'.tar.gz'),get('https://codeload.github.com/'+repo+'/tar.gz/'+rev))
              manifest['github'][repo]={'revision':rev,'default_branch':branch,**entry};print(repo,rev,flush=True)
          for model in ('C-Tianyu/NanoJev','Mapika/decider-2b','pngwn/system-one-qwen3.5-4b-scorer','Qwen/Qwen3.5-4B-Base','Qwen/Qwen3.5-2B-Base'):
              info=json.loads(get('https://huggingface.co/api/models/'+model));rev=info['sha'];folder=root/'models'/model.replace('/','__')
              save(folder/'metadata.json',json.dumps(info,indent=2).encode());files=[]
              paths=[s['rfilename'] for s in info['siblings'] if s['rfilename'].endswith(('.py','.md')) or s['rfilename'] in ('config.json','adapter_config.json','score_config.json','calibration.json','requirements.txt')]
              def fetch(p):return save(folder/p,get('https://huggingface.co/'+model+'/resolve/'+rev+'/'+p))
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:files=list(pool.map(fetch,paths))
              manifest['models'][model]={'revision':rev,'files':files};print(model,rev,paths,flush=True)
          for dataset in ('google/boolq','ikala/tmmluplus'):
              info=json.loads(get('https://huggingface.co/api/datasets/'+dataset));rev=info['sha'];folder=root/'datasets'/dataset.replace('/','__')
              save(folder/'metadata.json',json.dumps(info,indent=2).encode())
              paths=[s['rfilename'] for s in info['siblings'] if s['rfilename'].endswith(('.parquet','.csv','.jsonl','.md','.py'))]
              def fetch(p):return save(folder/p,get('https://huggingface.co/datasets/'+dataset+'/resolve/'+rev+'/'+p))
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:files=list(pool.map(fetch,paths))
              manifest['datasets'][dataset]={'revision':rev,'files':files};print(dataset,rev,'files',len(files),flush=True)
          save(root/'manifest.json',json.dumps(manifest,indent=2).encode())
          subprocess.run(['git','archive','--format=tar.gz','--output=audit/project.tar.gz','HEAD'],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jevlike-source-audit-${{ github.run_id }}
          path: audit/
          retention-days: 14
          if-no-files-found: error
